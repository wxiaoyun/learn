[tools]
bun = "latest"

[tasks.setup]
description = "Install dependencies, then link pi and install the Claude Code plugin in the learning directory"
run = """
#!/usr/bin/env bash
set -euo pipefail

repo="$PWD"
learning_root="${LEARNING_ROOT:-$HOME/learning}"

bun install

mkdir -p "$learning_root"
if [ -e "$learning_root/.pi" ] && [ ! -L "$learning_root/.pi" ]; then
  echo "$learning_root/.pi exists and is not a symlink, move it away first" >&2
  exit 1
fi
ln -sfn "$repo/packages/pi" "$learning_root/.pi"
echo "linked $learning_root/.pi -> $repo/packages/pi"

# Local scope belongs to the directory the command runs in, so run it from the
# learning directory. It keeps the absolute marketplace path out of any repo.
cd "$learning_root"
claude plugin marketplace add "$repo" --scope local
claude plugin install learning@learning --scope local
claude plugin details learning@learning
"""

[tasks."setup:undo"]
description = "Remove the pi link and the Claude Code plugin from the learning directory"
run = """
#!/usr/bin/env bash
set -uo pipefail

learning_root="${LEARNING_ROOT:-$HOME/learning}"
[ -L "$learning_root/.pi" ] && rm "$learning_root/.pi"
cd "$learning_root" || exit 0
claude plugin uninstall learning@learning --scope local
claude plugin marketplace remove learning
"""

[tasks."service:install"]
description = "Install and load the learning server as a launchd agent (macOS)"
run = "bun run packages/server/service.ts install"

[tasks."service:uninstall"]
description = "Unload and remove the learning server launchd agent"
run = "bun run packages/server/service.ts uninstall"
